{% extends "base.html" %}

{% block title %}System Maintenance - Class of 2027 Awards{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-neutral-900 border border-amber-500/30 rounded-2xl p-8 text-center shadow-[0_0_30px_rgba(201,168,76,0.15)]">
        <div class="w-16 h-16 rounded-full bg-amber-500/10 border border-amber-500/40 text-amber-400 flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h1 class="text-2xl font-heading font-bold text-neutral-100 mb-2">Portal Under Maintenance</h1>
        <p class="text-sm text-neutral-400 leading-relaxed mb-6">
            The Class of 2027 Awards committee is currently performing updates. The nomination system will reopen shortly.
        </p>
        <a href="{% url 'landing' %}" class="inline-block py-2.5 px-6 rounded-xl font-heading font-semibold text-xs uppercase tracking-wider bg-neutral-800 text-amber-400 border border-amber-500/30 hover:bg-neutral-750 transition-all">
            Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
