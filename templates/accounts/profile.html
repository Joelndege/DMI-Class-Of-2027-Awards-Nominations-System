{% extends "base.html" %}

{% block title %}My Profile - DMI Class of 2027 Awards{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-neutral-900 border border-amber-500/30 rounded-2xl p-8 shadow-[0_0_30px_rgba(201,168,76,0.1)]">
        <h1 class="text-2xl font-heading font-bold text-neutral-100 mb-6">Student Profile</h1>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-neutral-400 mb-1">Email</label>
                <input type="text" disabled value="{{ user.email }}" class="w-full px-4 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-neutral-400 text-sm cursor-not-allowed">
            </div>

            <div>
                <label class="block text-xs font-medium text-neutral-300 mb-1">Programme / Major</label>
                <input type="text" name="programme" value="{{ profile.programme }}" placeholder="e.g. Computer Science, Business Admin, Engineering"
                       class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 focus:border-amber-400 rounded-xl text-neutral-100 text-sm outline-none transition-colors">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full py-3 px-4 rounded-xl font-heading font-semibold text-sm bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-neutral-950 shadow-md transition-all">
                    Save Profile
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
