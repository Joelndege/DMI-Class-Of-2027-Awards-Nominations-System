{% extends "base.html" %}

{% block title %}Reset Password - DMI Class of 2027 Awards{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-neutral-900 border border-amber-500/30 rounded-2xl p-8 shadow-[0_0_30px_rgba(201,168,76,0.1)]">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold font-heading text-neutral-100">Reset Password</h1>
            <p class="text-xs text-neutral-400 mt-1">Enter your registered email to receive a recovery link</p>
        </div>

        <form method="POST" action="{% url 'account_reset_password' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-medium text-neutral-300 mb-1">Email Address</label>
                <input type="email" name="email" id="id_email" required
                       class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 focus:border-amber-400 rounded-xl text-neutral-100 text-sm outline-none transition-colors"
                       placeholder="you@student.edu">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl font-heading font-semibold text-sm bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-neutral-950 shadow-md transition-all">
                Send Reset Link
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'account_login' %}" class="text-xs text-amber-400 hover:text-amber-300 transition-colors">
                Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
